#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "glance"
name = "Glance"
description.en = "Self-hosted dashboard that puts all your feeds in one place"
description.fr = "Tableau de bord auto-hébergé qui regroupe tous vos flux au même endroit"

version = "0.8.7~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0"
admindoc = "https://github.com/glanceapp/glance/blob/main/docs/configuration.md"
code = "https://github.com/glanceapp/glance"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract   = true
    amd64.url = "https://github.com/glanceapp/glance/releases/download/v0.8.7/glance-linux-amd64.tar.gz"
    amd64.sha256 = "b9c169623825753e87f31e89514eefdeda38f51b6c024dcc4348fe087bc3592f"
    arm64.url = "https://github.com/glanceapp/glance/releases/download/v0.8.7/glance-linux-arm64.tar.gz"
    arm64.sha256 = "ddd44e888a77ae88a52cf8b860927c89d5bcec5b1886d45936dd29496449ab0c"
    armhf.url = "https://github.com/glanceapp/glance/releases/download/v0.8.7/glance-linux-armv7.tar.gz"
    armhf.sha256 = "08f84667feed8baecd273cdebac20a25a1076cfea29c6331f9de13c932656282"
    i386.url = "https://github.com/glanceapp/glance/releases/download/v0.8.7/glance-linux-386.tar.gz"
    i386.sha256 = "f623f9ccff23407bf3d29f147c62fbbc6c53cb41a7ba92654545d7ec5472bb0a"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^glance-linux-amd64.tar.gz$"
    autoupdate.asset.arm64 = "^glance-linux-arm64.tar.gz$"
    autoupdate.asset.armhf = "^glance-linux-armv7.tar.gz$"
    autoupdate.asset.i386 = "^glance-linux-386.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
