#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "glance"
name = "Glance"
description.en = "Self-hosted dashboard that puts all your feeds in one place"
description.fr = "Tableau de bord auto-hébergé qui regroupe tous vos flux au même endroit"

version = "0.8.8~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0"
admindoc = "https://github.com/glanceapp/glance/blob/main/docs/configuration.md"
code = "https://github.com/glanceapp/glance"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract   = true
    amd64.url = "https://github.com/glanceapp/glance/releases/download/v0.8.8/glance-linux-amd64.tar.gz"
    amd64.sha256 = "396b1ee30337afd5cac8d2e744dd449674d9691156536363096c1b92d96b291b"
    arm64.url = "https://github.com/glanceapp/glance/releases/download/v0.8.8/glance-linux-arm64.tar.gz"
    arm64.sha256 = "3aee9fee61b9c5ce9a2b68f415db0806a5e0096e335d0bb4f1fee064932d2124"
    armhf.url = "https://github.com/glanceapp/glance/releases/download/v0.8.8/glance-linux-armv7.tar.gz"
    armhf.sha256 = "e8516e98d05f6aba55b655941b0e9c740936161ae7f4055634d59eac28e19c04"
    i386.url = "https://github.com/glanceapp/glance/releases/download/v0.8.8/glance-linux-386.tar.gz"
    i386.sha256 = "47a139849de465e4fda2fe4b95e3f4e2f1408eda492feb4e7b921d2ad0a10f14"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^glance-linux-amd64.tar.gz$"
    autoupdate.asset.arm64 = "^glance-linux-arm64.tar.gz$"
    autoupdate.asset.armhf = "^glance-linux-armv7.tar.gz$"
    autoupdate.asset.i386 = "^glance-linux-386.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
