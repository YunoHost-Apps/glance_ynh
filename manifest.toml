#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "glance"
name = "Glance"
description.en = "Self-hosted dashboard that puts all your feeds in one place"
description.fr = "Tableau de bord auto-hébergé qui regroupe tous vos flux au même endroit"

version = "0.8.5~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0"
admindoc = "https://github.com/glanceapp/glance/blob/main/docs/configuration.md"
code = "https://github.com/glanceapp/glance"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract   = true
    amd64.url = "https://github.com/glanceapp/glance/releases/download/v0.8.5/glance-linux-amd64.tar.gz"
    amd64.sha256 = "1a1fafdd806c90e067df3e721a3f08ef2229d3741440c67d94ae915e351ca3d5"
    arm64.url = "https://github.com/glanceapp/glance/releases/download/v0.8.5/glance-linux-arm64.tar.gz"
    arm64.sha256 = "f94403814dc8cf202dbca6e2f3d7652f9d9faad47723f06e7dc139629079f35b"
    armhf.url = "https://github.com/glanceapp/glance/releases/download/v0.8.5/glance-linux-armv7.tar.gz"
    armhf.sha256 = "cb5825c8a3794a7c35ebf437e047cb6d66d747c92b9ee5bbc52e496377467864"
    i386.url = "https://github.com/glanceapp/glance/releases/download/v0.8.5/glance-linux-386.tar.gz"
    i386.sha256 = "93cac773a0860791764dfb352c7e8dbcec41664f5fd6e53b4de0db536ec833ce"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^glance-linux-amd64.tar.gz$"
    autoupdate.asset.arm64 = "^glance-linux-arm64.tar.gz$"
    autoupdate.asset.armhf = "^glance-linux-armv7.tar.gz$"
    autoupdate.asset.i386 = "^glance-linux-386.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
