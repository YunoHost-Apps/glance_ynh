#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "glance"
name = "Glance"
description.en = "Self-hosted dashboard that puts all your feeds in one place"
description.fr = "Tableau de bord auto-hébergé qui regroupe tous vos flux au même endroit"

version = "0.8.4~ynh1"

maintainers = []

[upstream]
license = "AGPL-3.0"
admindoc = "https://github.com/glanceapp/glance/blob/main/docs/configuration.md"
code = "https://github.com/glanceapp/glance"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    in_subdir = false
    extract   = true
    amd64.url = "https://github.com/glanceapp/glance/releases/download/v0.8.4/glance-linux-amd64.tar.gz"
    amd64.sha256 = "a69b6424cda4887e84247b1e01dbfb36ae613ac2cb37f19e307889db2cecc39b"
    arm64.url = "https://github.com/glanceapp/glance/releases/download/v0.8.4/glance-linux-arm64.tar.gz"
    arm64.sha256 = "ff716a1068708bf5ea53d14ba63f5ee2b6dbe6c8496d45f08e2c358861d15e77"
    armhf.url = "https://github.com/glanceapp/glance/releases/download/v0.8.4/glance-linux-armv7.tar.gz"
    armhf.sha256 = "5c086388a70adcee33e0852049cb4b70463f0c2efa42e640d3e71c8c8b8a724b"
    i386.url = "https://github.com/glanceapp/glance/releases/download/v0.8.4/glance-linux-386.tar.gz"
    i386.sha256 = "ae233cbc8d3dfc8e718ff317563b9642142021fd6836c2eac7a9bbbd5aa69e1a"

    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^glance-linux-amd64.tar.gz$"
    autoupdate.asset.arm64 = "^glance-linux-arm64.tar.gz$"
    autoupdate.asset.armhf = "^glance-linux-armv7.tar.gz$"
    autoupdate.asset.i386 = "^glance-linux-386.tar.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
